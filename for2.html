<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 종류와 활용</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <style>
        /* 내부스타일시트위치 */
    </style>
</head>
<body>
    <!-- 태그 작성위치 -->
    <h1>while</h1>
    <p>while문은 반복횟수가 정해져있지 않을 때 사용</p>
    <p>조건식은 while의 ()안에 쓰고 증감식은 {}안에 작성, 초기값은 밖</p>
    <input type="text" id="age" value="" placeholder="나이를 입력하세요">

    <h1>베스트 상품</h1>
    <section style="background: yellow;"><!-- 붙이기 --></section>
    <script>
        /* 내부스크립트위치(여기는 defer 작성불가) */
        //whlie 영화관람연령(12세 이상 관람가)
        const ageInput = document.querySelector('#age');
        while(ageInput.value){
            console.log('test');
        }

        //while 무한반복 문제
        // let cssQ = confirm('상하반전은 sclaeY(-1)이다.'); //1번 실행(whlie 밖)
        //cssQ == true;
        // while(cssQ == false){
        //     console.log('오답입니다'); //멈추는 명령이 따로 없는한 무한실행(while 안)
        //     cssQ = confirm('상하반전은 sclaeY(-1)이다.'); //오답일때 재질문
        //     break; //무한반복을 강제종료
        // }
        // console.log('정답입니다'); //while문 밖(while문이 거짓이 되어야 만나는 위치)

        //continue문
        for(let i=0; i<10; i++){
            continue;
            console.log('반복'+i);
        }
        //console.log('종료'+i);

        //구구단 2단
        for(let i=1; i<=9; i++){
            for(let j=1; j<10; j++){
                console.log(`${i}X${j}=${i*j}`);
            }
            console.log('----------------------------');
        }

        //ul*2-li*5
        /* const ul = document.createElement('ul');
        const il = document.createElement('il');
        ul.classList.add('product_wrap');
        li.classList.add('item');
        console.log(ul, li); */

        const section = document.querySelector('section');
        createList(4, 3);

        function createList(num1,num2){
            for(let i=1; i<num1; i++){
                const ul = document.createElement('ul');
                ul.classList.add('product_wrap');
                for(let k=0; k<num2; k++){
                    const li = document.createElement('li');
                    li.classList.add('item');
                    li.textContent = '아메리카노 1500원';
                    ul.appendChild(li);
                    //console.log(li);
                }
                ul.style.borderBottom = '2px solid #000';
                section.appendChild(ul);
                //console.log(ul);
            }
        }

        //tr(행) td(열)
        //2행 3열 표
        const table = document.createElement('table');
        for(let i=0; i<2; i++){
            const tr = document.createElement('tr');

            for(let k=0; k<3; k++){
                const td = document.createElement('td');
                td.textContent = '망고스무디 4000원';
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        document.body.style.border = '2px solid #000'
        document.body.appendChild(table);
    </script>
</body>
</html>
